prometheus:
  prometheusSpec:
    # Reference your custom rules ConfigMaps
    additionalRuleLabels:
      app: fastapi
    # Configure retention and resource limits as needed
    retention: 15d
    resources:
      requests:
        memory: 1Gi
        cpu: 500m
      limits:
        memory: 2Gi
        cpu: 1000m

server:
  additionalScrapeConfigs:
    - job_name: 'widget-api'
      static_configs:
        - targets: ['widget-api:8000']

alertmanager:
  config:
    global:
      resolve_timeout: 5m
      smtp_smarthost: 'smtp.example.com:587'
      smtp_from: 'alertmanager@example.com'
      smtp_auth_username: 'alertmanager'
      smtp_auth_password: 'password'
      slack_api_url: 'https://hooks.slack.com/services/YOUR_SLACK_WEBHOOK_URL'
    
    templates:
    - '/etc/alertmanager/config/*.tmpl'
    
    route:
      receiver: 'team-email'
      group_by: ['alertname', 'severity']
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 4h
      routes:
      - match:
          severity: 'critical'
        receiver: 'team-critical'
        continue: true
      - match_re:
          alertname: 'PossibleSecurityProbing|RepeatedAccessAttempts|BruteForceAttempt'
        receiver: 'security-team'
      - match_re:
          alertname: 'SlowEndpointResponses|CriticalEndpointLatency|HighErrorRate'
        receiver: 'ops-team'
    
    inhibit_rules:
    - source_match:
        severity: 'critical'
      target_match:
        severity: 'warning'
      equal: ['instance', 'alertname']
    
    receivers:
    - name: 'team-email'
      email_configs:
      - to: 'team@example.com'
        send_resolved: true
    
    - name: 'team-critical'
      slack_configs:
      - channel: '#alerts'
        send_resolved: true
        title: "{{ .GroupLabels.alertname }} - CRITICAL"
        title_link: 'https://grafana.example.com'
        text: "{{ range .Alerts }}{{ .Annotations.description }}\n{{ end }}"
        color: 'danger'
      email_configs:
      - to: 'oncall@example.com'
        send_resolved: true
    
    - name: 'security-team'
      slack_configs:
      - channel: '#security'
        send_resolved: true
        title: "{{ .GroupLabels.alertname }} - Security Alert"
        text: "{{ range .Alerts }}{{ .Annotations.description }}\n{{ end }}"
        color: 'danger'
      email_configs:
      - to: 'security@example.com'
        send_resolved: true
    
    - name: 'ops-team'
      slack_configs:
      - channel: '#ops'
        send_resolved: true
        title: "{{ .GroupLabels.alertname }} - Performance Alert"
        text: "{{ range .Alerts }}{{ .Annotations.description }}\n{{ end }}"
        color: 'warning'
      email_configs:
      - to: 'ops@example.com'
        send_resolved: true